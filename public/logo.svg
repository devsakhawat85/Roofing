<svg viewBox="0 0 400 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roofOrangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FB923C" />
      <stop offset="50%" stopColor="#F97316" />
      <stop offset="100%" stopColor="#EA580C" />
    </linearGradient>

    <linearGradient id="baseBlueGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0284C7" />
      <stop offset="100%" stopColor="#0369A1" />
    </linearGradient>

    <linearGradient id="baseBlueGradRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>

    <linearGradient id="textShadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#091322" />
    </linearGradient>

    <linearGradient id="shieldNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0E1E34" />
      <stop offset="50%" stopColor="#0A1526" />
      <stop offset="100%" stopColor="#070D18" />
    </linearGradient>
  </defs>

  <!-- Top Roof Peak Hexagon -->
  <polygon points="200,8 250,38 250,90 200,60 150,90 150,38" fill="url(#shieldNavyGrad)" stroke="#1E293B" stroke-width="3" />
  
  <!-- Orange Roof Peak -->
  <path d="M 152 42 L 200 14 L 248 42 L 236 54 L 200 32 L 164 54 Z" fill="url(#roofOrangeGrad)" />
  
  <!-- Upward Arrow -->
  <path d="M 200 38 L 230 64 L 214 64 L 214 88 L 186 88 L 186 64 L 170 64 Z" fill="url(#roofOrangeGrad)" />

  <!-- Lower Cyan/Blue Facet -->
  <polygon points="200,248 135,188 200,214 265,188" fill="#070D18" />
  <polygon points="200,246 142,192 200,214" fill="url(#baseBlueGradLeft)" />
  <polygon points="200,246 258,192 200,214" fill="url(#baseBlueGradRight)" />

  <!-- Angled Shield Wing Banner -->
  <path d="M 32 118 L 364 58 L 352 142 L 320 186 L 200 262 L 80 186 L 48 142 Z" fill="url(#shieldNavyGrad)" stroke="#1E293B" stroke-width="4" stroke-linejoin="round" />
  <polygon points="38,122 358,66 316,182 200,252 84,182" fill="#08101E" />

  <!-- 3D "LEVEL UP!" Typography -->
  <g transform="skewY(-5.8) translate(10, 36)">
    <!-- Base Extrusion -->
    <text x="195" y="136" text-anchor="middle" font-family="'Syne', 'Impact', sans-serif" font-size="64" font-weight="900" letter-spacing="-0.02em" fill="#050B14" stroke="#03070D" stroke-width="10" stroke-linejoin="round">LEVEL UP!</text>
    <text x="195" y="133" text-anchor="middle" font-family="'Syne', 'Impact', sans-serif" font-size="64" font-weight="900" letter-spacing="-0.02em" fill="url(#textShadowGrad)" stroke="#0C1A2E" stroke-width="4" stroke-linejoin="round">LEVEL UP!</text>
    <!-- Crisp White Face -->
    <text x="195" y="128" text-anchor="middle" font-family="'Syne', 'Impact', sans-serif" font-size="64" font-weight="900" letter-spacing="-0.02em" fill="#FFFFFF">LEVEL UP!</text>
  </g>

  <!-- "ROOFER MARKETING" -->
  <g transform="skewY(-5.8) translate(10, 36)">
    <text x="195" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="900" letter-spacing="0.28em" fill="#FB923C" stroke="#08101E" stroke-width="1.5" paint-order="stroke fill">ROOFER MARKETING</text>
  </g>
</svg>
